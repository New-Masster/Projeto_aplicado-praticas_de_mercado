name: Deploy Seguro na Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Enviar arquivos do projeto para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          source: "app.py,requirements.txt,templates/"
          target: "/home/ubuntu/meu-projeto-mvc"

      - name: Instalar dependências e reiniciar aplicação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ubuntu/meu-projeto-mvc

            python3 -m venv venv

            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt

            pkill -f "gunicorn.*app:app" || true

            nohup env \
              SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
              ADMIN_USERNAME="${{ secrets.APP_ADMIN_USERNAME }}" \
              ADMIN_PASSWORD_HASH="${{ secrets.APP_ADMIN_PASSWORD_HASH }}" \
              FLASK_SECURE_COOKIE="1" \
              venv/bin/gunicorn \
              --workers 1 \
              --bind 127.0.0.1:5000 \
              app:app \
              > app.log 2>&1 &

            sleep 3

            curl --fail --silent --show-error \
              http://127.0.0.1:5000/login \
              > /dev/null

            echo "Deploy concluído com sucesso."