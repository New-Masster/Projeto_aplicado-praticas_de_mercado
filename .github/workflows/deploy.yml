
name: Deploy Seguro na Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Preparar arquivo de ambiente
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD_HASH: ${{ secrets.APP_ADMIN_PASSWORD_HASH }}
        run: |
          umask 077

          cat > meu-projeto.env <<EOF
          SECRET_KEY=$APP_SECRET_KEY
          ADMIN_USERNAME=$APP_ADMIN_USERNAME
          ADMIN_PASSWORD_HASH=$APP_ADMIN_PASSWORD_HASH
          FLASK_SECURE_COOKIE=1
          EOF

      - name: Enviar arquivos do projeto para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          source: "app.py,requirements.txt,templates/,meu-projeto.env"
          target: "/tmp"

      - name: Instalar dependências e reiniciar aplicação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ubuntu/meu-projeto-mvc

            sudo install \
              -o root \
              -g root \
              -m 600 \
              /tmp/meu-projeto.env \
              /etc/meu-projeto.env

            rm -f /tmp/meu-projeto.env

            python3 -m venv venv

            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt

            sudo systemctl daemon-reload
            sudo systemctl enable meu-projeto.service
            sudo systemctl restart meu-projeto.service

            sleep 3

            sudo systemctl is-active --quiet meu-projeto.service

            curl --fail --silent --show-error \
              http://127.0.0.1:5000/login \
              > /dev/null

            echo "Deploy concluído com sucesso."

