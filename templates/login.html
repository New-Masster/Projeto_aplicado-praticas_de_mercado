<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto de Segurança</title>
</head>
<body>
    <main>
        <h1>Projeto de Segurança da Informação</h1>
        <h2>Login</h2>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div>
                <label for="username">Usuário</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >
            </div>

            <div>
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
